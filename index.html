<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meine Werder-Spiele</title>
  <meta name="description" content="Alle Werder-Spiele, die ich im Stadion gesehen habe – mit Statistiken.">
  <meta name="theme-color" content="#0B3D23">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <span class="hero-crest"><img src="assets/logos/werder.png" alt="" onerror="this.parentNode.classList.add('empty');this.remove()"></span>
      <div class="hero-text">
        <h1>Meine Werder-Spiele</h1>
        <p id="hero-sub">Lade Daten …</p>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
    <div class="hero-record" id="hero-record"></div>
  </header>

  <nav class="tabs" aria-label="Bereiche">
    <a href="#/" data-tab="">Übersicht</a>
    <a href="#/spiele" data-tab="spiele">Spiele</a>
    <a href="#/statistiken" data-tab="statistiken">Statistiken</a>
    <a href="#/gegner" data-tab="gegner">Gegner</a>
    <a href="#/stadien" data-tab="stadien">Stadien</a>
    <a href="#/u23" data-tab="u23">U23 &amp; Allstars</a>
    <a href="#/check" data-tab="check">Datencheck <span id="check-badge" class="badge" hidden></span></a>
  </nav>

  <main id="view" aria-live="polite">
    <div class="loading"><span class="spinner"></span> Lade Spiele …</div>
  </main>

  <dialog id="game-dialog">
    <div id="game-dialog-body"></div>
    <form method="dialog"><button class="close-btn" aria-label="Schließen">✕</button></form>
  </dialog>

  <footer class="foot" id="foot"></footer>
</body>
</html>
